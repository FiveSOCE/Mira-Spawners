spawners:
  max-stack-size: 64
  silk-touch-required: true
  natural-spawners-harvestable: true
  protect-from-explosions: true
  split-gui:
    enabled: true

analytics:
  # Estimated target production used by /mspawners stats efficiency percentages.
  target-units-per-hour-per-spawner: 144.0

mobs:
  max-stack-size: 1000
  merge-radius: 6.0
  show-stack-name: true
  lava-stack-kill: true

  # Hostile mobs may only exist when they originate from a Mira-managed,
  # player-placed mob spawner. Natural hostile spawning and natural vanilla
  # hostile spawners are blocked.
  block-non-spawner-hostiles: true

  # These mobs are disabled completely, including spawners, eggs,
  # commands, plugins and already-loaded entities.
  fully-blocked-types:
    - BAT
    - STRAY
