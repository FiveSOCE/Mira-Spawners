spawners:
  max-stack-size: 64
  silk-touch-required: true
  natural-spawners-harvestable: true
  protect-from-explosions: true

mobs:
  max-stack-size: 1000
  merge-radius: 6.0
  show-stack-name: true
  lava-stack-kill: true

  # Hostile mobs may only exist when their spawn reason is a normal mob spawner.
  block-non-spawner-hostiles: true

  # These mobs are disabled completely, including normal spawners, eggs,
  # commands, plugins and already-loaded entities.
  fully-blocked-types:
    - BAT
    - STRAY
