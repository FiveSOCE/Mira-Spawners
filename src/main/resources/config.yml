spawners:
  max-stack-size: 64
  silk-touch-required: true
  natural-spawners-harvestable: true
  protect-from-explosions: true

  # Baseline spawner behavior when there is no active fueled MiraLoader.
  # Old builds used 0 here internally; v0.1.16 repairs those persisted values.
  required-player-range: 16
  max-nearby-entities: 6

  split-gui:
    enabled: true

analytics:
  # Estimated target production used by /mspawners stats efficiency percentages.
  target-units-per-hour-per-spawner: 144.0

mobs:
  max-stack-size: 1000
  merge-radius: 6.0
  show-stack-name: true
  lava-stack-kill: true

  # Natural/unmanaged hostile spawning can be blocked while physical spawners,
  # Mira-managed spawners, command spawns and intentional plugin spawns remain valid.
  block-non-spawner-hostiles: true

  # These mobs are disabled completely, including spawners, eggs,
  # commands, plugins and already-loaded entities.
  fully-blocked-types:
    - BAT
    - STRAY
    - PHANTOM
