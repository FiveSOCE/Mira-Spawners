name: Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 065c2a19d797fd946ad0068d5dee63590f5d6d34

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            build/libs/MiraSpawners-0.1.2.jar \
            --target 065c2a19d797fd946ad0068d5dee63590f5d6d34 \
            --title "MiraSpawners v0.1.2" \
            --notes "MiraSpawners v0.1.2\n\nSpawner identification cleanup. Spawner items now show a clean plain-white, non-italic mob-specific name such as Zombie Spawner, Skeleton Spawner or Creeper Spawner. They still have no lore and no BlockStateMeta warning tooltip. Inventory stacks remain real physical spawner counts and stacked blocks still break back into individual spawner units."
