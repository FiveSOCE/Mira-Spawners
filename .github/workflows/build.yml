name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MiraSpawners-0.1.12
          path: build/libs/MiraSpawners-0.1.12.jar
          if-no-files-found: error
      - name: Publish release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.12 >/dev/null 2>&1; then
            gh release create v0.1.12 build/libs/MiraSpawners-0.1.12.jar --target "${{ github.sha }}" --title "MiraSpawners v0.1.12" --notes "Hard-blocks Phantoms and baby Zombies from all spawn sources, eliminating chicken jockey riders and enforcing fully-blocked mobs even for custom/command spawns."
          fi
