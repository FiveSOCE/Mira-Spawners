name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraSpawners-0.1.10
          path: build/libs/MiraSpawners-0.1.10.jar
          if-no-files-found: error

      - name: Publish v0.1.10 release if missing
        if: success() && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.10 >/dev/null 2>&1; then
            gh release create v0.1.10 \
              build/libs/MiraSpawners-0.1.10.jar \
              --target "${{ github.sha }}" \
              --title "MiraSpawners v0.1.10" \
              --notes "Ensures every mob spawned by a Mira-managed/player-placed spawner is forced to its adult form, preventing baby zombies and other baby variants while leaving natural/event spawns untouched."
          fi
