name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: a7be90c84d6f732e8da1673dec51f82d4f811ac6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 \
            build/libs/MiraSpawners-0.1.3.jar \
            --target a7be90c84d6f732e8da1673dec51f82d4f811ac6 \
            --title "MiraSpawners v0.1.3" \
            --notes "MiraSpawners v0.1.3\n\nAdds the requested admin command set: /mspawners help, /mspawners give <spawner> [amount], /mspawners change <spawner>, and /mspawners stack. Give now targets the executing player and defaults to one spawner. Change converts the held spawner stack to another mob type while preserving its count. Stack sets the spawner the player is looking at to the configured 64 maximum. Also fixes the runtime self-test for the new plain-white mob-specific spawner names."
