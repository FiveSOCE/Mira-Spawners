name: Release v0.1.8

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 5d1134d93e9ec01ab0d878b9d4bb1ec339e689c5
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.8 \
            build/libs/MiraSpawners-0.1.8.jar \
            --target 5d1134d93e9ec01ab0d878b9d4bb1ec339e689c5 \
            --title "MiraSpawners v0.1.8" \
            --notes "Spawner intelligence update. Adds spawner efficiency statistics, an optional placed-stack split GUI, and faction-linked spawner analytics built on the public SpawnerStackChangeEvent integration introduced in v0.1.7."