name: Release v0.1.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 2cf57e9ff25aeca5b1519235ec04ca0c3b2d5b4d
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.6 \
            build/libs/MiraSpawners-0.1.6.jar \
            --target 2cf57e9ff25aeca5b1519235ec04ca0c3b2d5b4d \
            --title "MiraSpawners v0.1.6" \
            --notes "Allows intentional hostile spawns created by commands or plugins while keeping natural/unmanaged hostile spawning blocked. CUSTOM and COMMAND entities receive a persistent policy exemption so event mobs such as MiraPinata survive chunk unload/reload cleanup."
