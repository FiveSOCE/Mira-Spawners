name: Release v0.1.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 9451cacc5a3a07ad4d45659fc12c6d1062a5ce63
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Test and build
        run: gradle clean test build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.5 \
            build/libs/MiraSpawners-0.1.5.jar \
            --target 9451cacc5a3a07ad4d45659fc12c6d1062a5ce63 \
            --title "MiraSpawners v0.1.5" \
            --notes "Enforces player-spawner-only hostile mobs. Natural hostile spawning and natural hostile vanilla spawners are blocked; only mobs originating from Mira-managed player-placed spawners remain valid. Bat and Stray remain fully blocked."
