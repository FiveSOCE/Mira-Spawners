name: Release v0.1.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: af7041835c3006156f8126ee26a343cb18e33b3c
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.7 \
            build/libs/MiraSpawners-0.1.7.jar \
            --target af7041835c3006156f8126ee26a343cb18e33b3c \
            --title "MiraSpawners v0.1.7" \
            --notes "Integration hook update. Adds the public SpawnerStackChangeEvent for place, stack, break and API-driven stack changes, including location, mob type, old/new stack amounts, delta, cause and actor UUID. Placement events consistently report 0 to the full placed stack."
