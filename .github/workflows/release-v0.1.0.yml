name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraSpawners-0.1.0.jar \
            --target ae1a15220b643ef3151229949e2494ab47a5cace \
            --title "MiraSpawners v0.1.0" \
            --notes "MiraSpawners v0.1.0\n\nInitial release for Paper 1.21.11 / Java 21. Includes Silk Touch spawner harvesting, compact 64x spawner stacks, left-click stack inspection, performance-friendly mob stacking, one-at-a-time normal deaths, direct-lava full-stack death with full loot processing, explosion protection, MiraCore module/API integration, admin giving and runtime diagnostics."
